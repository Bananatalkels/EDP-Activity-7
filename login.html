<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Firearm Registry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <script src="db.js"></script>
  <style>
    :root {
      --brand:   #1d4ed8;
      --accent:  #f59e0b;
      --dark:    #0f172a;
      --surface: #1e293b;
      --text:    #e2e8f0;
      --muted:   #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(29,78,216,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(29,78,216,.07) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridShift 20s linear infinite;
      pointer-events: none;
    }
    @keyframes gridShift { to { background-position: 40px 40px; } }

    .card {
      background: var(--surface);
      border: 1px solid rgba(29,78,216,.3);
      border-radius: 4px;
      width: 420px;
      padding: 48px 40px;
      position: relative;
      box-shadow: 0 0 60px rgba(29,78,216,.15);
      animation: fadeUp .5s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }
    /* Corner accent */
    .card::before {
      content:'';
      position:absolute;
      top:-1px; left:-1px;
      width:40px; height:40px;
      border-top: 2px solid var(--accent);
      border-left: 2px solid var(--accent);
    }
    .card::after {
      content:'';
      position:absolute;
      bottom:-1px; right:-1px;
      width:40px; height:40px;
      border-bottom: 2px solid var(--accent);
      border-right: 2px solid var(--accent);
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 42px; height: 42px;
      background: var(--brand);
      border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: #fff;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    .logo-text h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: var(--text);
      letter-spacing: 2px;
      line-height: 1;
    }
    .logo-text p {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: var(--dark);
      border: 1px solid rgba(100,116,139,.4);
      border-radius: 2px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--brand); }
    .field { margin-bottom: 20px; }

    .btn-primary {
      width: 100%;
      background: var(--brand);
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      padding: 12px;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background .2s, transform .1s;
      margin-top: 8px;
    }
    .btn-primary:hover { background: #1e40af; }
    .btn-primary:active { transform: scale(.98); }

    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
    }
    .links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .links a:hover { text-decoration: underline; }

    .alert {
      padding: 10px 14px;
      border-radius: 2px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .alert-error  { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.4); color: #fca5a5; }
    .alert-success{ background: rgba(34,197,94,.15);  border: 1px solid rgba(34,197,94,.4);  color: #86efac; }

    .version-tag {
      position: fixed;
      bottom: 16px; right: 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-row">
    <div class="logo-icon">FR</div>
    <div class="logo-text">
      <h1>Firearm Registry</h1>
      <p>SECURE SYSTEM ACCESS</p>
    </div>
  </div>

  <div class="alert alert-error" id="alertBox"></div>

  <div class="field">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="off"/>
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••"/>
  </div>

  <button class="btn-primary" onclick="handleLogin()">LOGIN</button>

  <div class="links">
    <a href="recovery.html">Forgot Password?</a>
  </div>
</div>

<div class="version-tag">v1.0.4 — IT 120 Activity 4</div>

<script>
  // ── Seed DB on load ──────────────────────────────────────────
  DB.seedFromJSON('users.json');
  DB.seedDemoData();

  // ── Handle Login ─────────────────────────────────────────────
  function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const alertBox = document.getElementById('alertBox');

    alertBox.style.display = 'none';

    if (!username || !password) {
      showAlert('Please fill in all fields.', 'error');
      return;
    }

    // SELECT * FROM tbl_users WHERE username = ? AND password = ?
    const users = DB.select(MySQLConnection.TABLES.USERS, { username, password });

    if (users.length === 0) {
      showAlert('Invalid username or password.', 'error');
      return;
    }

    const user = users[0];

    if (user.status !== 'Active') {
      showAlert('Your account is inactive. Contact the administrator.', 'error');
      return;
    }

    // Save session
    sessionStorage.setItem('currentUser', JSON.stringify(user));

    // Redirect to dashboard
    window.location.href = 'dashboard.html';
  }

  function showAlert(msg, type) {
    const box = document.getElementById('alertBox');
    box.textContent = msg;
    box.className = `alert alert-${type}`;
    box.style.display = 'block';
  }

  // Allow Enter key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleLogin();
  });

  // If already logged in, redirect
  if (sessionStorage.getItem('currentUser')) {
    window.location.href = 'dashboard.html';
  }
</script>

</body>
</html>
