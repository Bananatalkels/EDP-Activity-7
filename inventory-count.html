            <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory Count — Firearm Registry</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <script src="db.js"></script>
  <script src="app-common.js"></script>
  <link rel="stylesheet" href="app-layout.css"/>
  <style>
    .var-ok { color:#4ade80; font-family:'IBM Plex Mono',monospace; }
    .var-bad { color:#f87171; font-family:'IBM Plex Mono',monospace; font-weight:600; }
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-brand"><div class="icon">FR</div><div><div class="name">FIREARM REG.</div><div class="ver">v1.0.5</div></div></div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-user">
    <div class="user-avatar" id="sidebarAvatar"></div>
    <div class="user-info"><div class="user-name" id="sidebarName"></div><div class="user-role" id="sidebarRole"></div></div>
    <button class="logout-btn" onclick="logout()">⏏</button>
  </div>
</aside>
<main class="main">
  <div class="topbar"><div><div class="breadcrumb">TRANSACTIONS / INVENTORY COUNT</div><h2>Inventory Count</h2></div></div>
  <div class="content">
    <div class="toolbar">
      <div class="search-wrap"><span class="icon">⌕</span><input type="text" id="searchInput" placeholder="Search count no, serial..." oninput="renderTable()"/></div>
      <button class="btn btn-primary" onclick="openModal()">+ RECORD COUNT</button>
      <button class="btn btn-outline" onclick="runBatchCount()">RUN FULL AUDIT</button>
    </div>
    <div class="alert" id="mainAlert"></div>
    <div class="table-wrap">
      <table><thead><tr>
        <th>Count No</th><th>Count Date</th><th>Serial</th><th>Model</th><th>System Qty</th><th>Physical Qty</th><th>Variance</th><th>Counted By</th><th>Actions</th>
      </tr></thead><tbody id="tableBody"></tbody></table>
    </div>
  </div>
</main>
<div class="modal-overlay" id="txnModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">RECORD INVENTORY COUNT</div>
    <div class="alert" id="modalAlert"></div>
    <div class="form-grid">
      <div class="field"><label>Firearm (Serial)</label><select id="f_serial"></select></div>
      <div class="field"><label>Count Date</label><input type="date" id="f_countDate"/></div>
      <div class="field"><label>System Qty</label><input type="number" id="f_systemQty" value="1" min="0" readonly/></div>
      <div class="field"><label>Physical Qty</label><input type="number" id="f_physicalQty" min="0" value="1"/></div>
      <div class="field" style="grid-column:1/-1"><label>Notes</label><input type="text" id="f_notes" placeholder="Optional remarks"/></div>
    </div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">CANCEL</button><button class="btn btn-primary" onclick="saveCount()">SAVE</button></div>
  </div>
</div>
<script>
  const currentUser = initApp("inventory-count");
  const T = MySQLConnection.TABLES;
  const INV = T.INVENTORY;
  const CNT = T.INVENTORY_COUNT;

  function loadSerials() {
    const sel = document.getElementById("f_serial");
    sel.innerHTML = '<option value="">— Select —</option>' + DB.select(INV).map(i =>
      `<option value="${i.serial}" data-model="${i.model}">${i.serial} — ${i.model}</option>`
    ).join("");
  }

  function getFiltered() {
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    return DB.select(CNT).filter(r => !q || [r.countNo, r.serial, r.model].join(" ").toLowerCase().includes(q)).reverse();
  }

  function renderTable() {
    const rows = getFiltered();
    const tbody = document.getElementById("tableBody");
    if (!rows.length) { tbody.innerHTML = '<tr><td colspan="9"><div class="empty"><p>No inventory count records.</p></div></td></tr>'; return; }
    tbody.innerHTML = rows.map(r => {
      const v = r.variance;
      const vc = v === 0 ? "var-ok" : "var-bad";
      return `<tr>
        <td style="font-family:'IBM Plex Mono',monospace;font-weight:600">${r.countNo}</td>
        <td>${r.countDate}</td><td>${r.serial}</td><td>${r.model}</td>
        <td>${r.systemQty}</td><td>${r.physicalQty}</td>
        <td class="${vc}">${v > 0 ? "+" : ""}${v}</td>
        <td style="font-size:12px;color:var(--muted)">${r.countedBy}</td>
        <td><button class="icon-btn del" onclick="deleteCount(${r.id})">✕</button></td>
      </tr>`;
    }).join("");
  }

  function openModal() {
    document.getElementById("f_countDate").value = todayISO();
    document.getElementById("f_physicalQty").value = 1;
    document.getElementById("f_systemQty").value = 1;
    document.getElementById("f_notes").value = "";
    loadSerials();
    document.getElementById("txnModal").classList.add("show");
  }

  function saveCount() {
    const serial = document.getElementById("f_serial").value;
    const opt = document.getElementById("f_serial").selectedOptions[0];
    const countDate = document.getElementById("f_countDate").value;
    const systemQty = parseInt(document.getElementById("f_systemQty").value, 10) || 1;
    const physicalQty = parseInt(document.getElementById("f_physicalQty").value, 10);
    const notes = document.getElementById("f_notes").value.trim();
    if (!serial || !countDate || isNaN(physicalQty)) { showAlert("modalAlert", "Serial, date, and physical qty required.", "error"); return; }
    DB.insert(CNT, {
      countNo: nextTxnNo("CNT", CNT), countDate, serial, model: opt?.dataset.model || "",
      systemQty, physicalQty, variance: physicalQty - systemQty, notes, countedBy: currentUser.fullName,
    });
    showAlert("mainAlert", "Count recorded.", "success");
    closeModal(); renderTable();
  }

  function runBatchCount() {
    if (!confirm("Run full inventory audit for all items?")) return;
    const items = DB.select(INV);
    const batchNo = nextTxnNo("CNT", CNT);
    items.forEach((item, i) => {
      DB.insert(CNT, {
        countNo: batchNo + "-" + String(i + 1).padStart(2, "0"),
        countDate: todayISO(), serial: item.serial, model: item.model,
        systemQty: 1, physicalQty: 1, variance: 0, notes: "Batch audit", countedBy: currentUser.fullName,
      });
    });
    showAlert("mainAlert", `Full audit completed (${items.length} items).`, "success");
    renderTable();
  }

  function deleteCount(id) {
    if (!confirm("Delete count record?")) return;
    DB.delete(CNT, { id }); showAlert("mainAlert", "Record deleted.", "success"); renderTable();
  }

  function closeModal() { document.getElementById("txnModal").classList.remove("show"); }
  document.getElementById("txnModal").addEventListener("click", e => { if (e.target.id === "txnModal") closeModal(); });
  renderTable();
</script>
</body>
</html>
