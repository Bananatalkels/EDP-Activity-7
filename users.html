<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Management — Firearm Registry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <script src="db.js"></script>
  <script src="app-common.js"></script>
  <style>
    :root { --brand:#1d4ed8; --accent:#f59e0b; --dark:#0f172a; --surface:#1e293b; --card:#243044; --text:#e2e8f0; --muted:#64748b; --border:rgba(100,116,139,.2); --danger:#ef4444; --success:#22c55e; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'IBM Plex Sans',sans-serif; background:var(--dark); color:var(--text); display:flex; min-height:100vh; }

    /* ── Sidebar (shared) ── */
    .sidebar { width:240px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; height:100vh; position:sticky; top:0; }
    .sidebar-brand { padding:24px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
    .sidebar-brand .icon { width:34px; height:34px; background:var(--brand); border-radius:2px; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:16px; color:#fff; letter-spacing:1px; }
    .sidebar-brand .name { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; color:var(--text); line-height:1; }
    .sidebar-brand .ver { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); letter-spacing:1px; }
    .sidebar-nav { flex:1; padding:16px 12px; }
    .nav-label { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted); padding:0 8px; margin:16px 0 6px; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:3px; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; transition:all .15s; text-decoration:none; margin-bottom:2px; }
    .nav-item:hover { background:rgba(29,78,216,.15); color:var(--text); }
    .nav-item.active { background:var(--brand); color:#fff; }
    .nav-item .icon { font-size:15px; width:18px; text-align:center; }
    .sidebar-user { padding:16px 20px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; }
    .user-avatar { width:34px; height:34px; border-radius:50%; background:var(--brand); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:#fff; flex-shrink:0; }
    .user-info { flex:1; min-width:0; }
    .user-name { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .user-role { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); }
    .logout-btn { font-size:16px; cursor:pointer; color:var(--muted); transition:color .15s; background:none; border:none; padding:4px; }
    .logout-btn:hover { color:var(--danger); }

    /* ── Main ── */
    .main { flex:1; overflow-y:auto; }
    .topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:16px 32px; display:flex; align-items:center; justify-content:space-between; }
    .topbar h2 { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:3px; color:var(--text); }
    .topbar .breadcrumb { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:1px; }
    .content { padding:32px; }

    /* ── Toolbar ── */
    .toolbar { display:flex; align-items:center; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
    .search-wrap { position:relative; flex:1; min-width:200px; }
    .search-wrap input {
      width:100%; background:var(--card); border:1px solid var(--border); border-radius:2px;
      padding:9px 14px 9px 36px; color:var(--text);
      font-family:'IBM Plex Mono',monospace; font-size:13px; outline:none; transition:border-color .2s;
    }
    .search-wrap input:focus { border-color:var(--brand); }
    .search-wrap .icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; color:var(--muted); }
    .filter-select {
      background:var(--card); border:1px solid var(--border); border-radius:2px;
      padding:9px 14px; color:var(--text);
      font-family:'IBM Plex Mono',monospace; font-size:12px; outline:none;
    }
    .btn { padding:9px 18px; border:none; border-radius:2px; cursor:pointer; transition:all .15s; font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:2px; }
    .btn-primary { background:var(--brand); color:#fff; }
    .btn-primary:hover { background:#1e40af; }
    .btn-success { background:var(--success); color:#fff; }
    .btn-success:hover { background:#16a34a; }
    .btn-danger  { background:var(--danger); color:#fff; }
    .btn-danger:hover { background:#dc2626; }
    .btn-outline { background:transparent; color:var(--muted); border:1px solid var(--border); font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1px; padding:6px 12px; }
    .btn-outline:hover { border-color:var(--brand); color:var(--text); }

    /* ── Table ── */
    .table-wrap { background:var(--card); border:1px solid var(--border); border-radius:3px; overflow:hidden; }
    table { width:100%; border-collapse:collapse; }
    thead tr { background:rgba(29,78,216,.12); }
    th { padding:10px 16px; font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted); text-align:left; cursor:pointer; user-select:none; }
    th:hover { color:var(--text); }
    td { padding:12px 16px; font-size:13px; color:var(--text); border-top:1px solid var(--border); }
    tbody tr:hover { background:rgba(255,255,255,.02); }

    .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:1px; }
    .badge-active   { background:rgba(34,197,94,.15);  color:#4ade80; }
    .badge-inactive { background:rgba(239,68,68,.15);   color:#f87171; }
    .badge-admin    { background:rgba(245,158,11,.15);  color:#fbbf24; }
    .badge-officer  { background:rgba(59,130,246,.15);  color:#60a5fa; }
    .badge-staff    { background:rgba(100,116,139,.15); color:#94a3b8; }

    .action-btns { display:flex; gap:6px; }
    .icon-btn {
      padding:5px 8px; border-radius:2px; border:none; cursor:pointer;
      font-size:13px; transition:all .15s;
    }
    .icon-btn.edit    { background:rgba(29,78,216,.2);  color:#60a5fa; }
    .icon-btn.edit:hover { background:rgba(29,78,216,.4); }
    .icon-btn.toggle  { background:rgba(34,197,94,.2);  color:#4ade80; }
    .icon-btn.toggle:hover { background:rgba(34,197,94,.4); }
    .icon-btn.toggleOff { background:rgba(239,68,68,.2); color:#f87171; }
    .icon-btn.toggleOff:hover { background:rgba(239,68,68,.4); }
    .icon-btn.del     { background:rgba(239,68,68,.15); color:#f87171; }
    .icon-btn.del:hover { background:rgba(239,68,68,.35); }

    /* ── Modal ── */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.7);
      display:flex; align-items:center; justify-content:center;
      z-index:1000; backdrop-filter:blur(4px);
      opacity:0; pointer-events:none; transition:opacity .2s;
    }
    .modal-overlay.show { opacity:1; pointer-events:all; }
    .modal {
      background:var(--surface); border:1px solid var(--border);
      border-radius:4px; width:480px; padding:40px;
      position:relative;
      transform:translateY(20px); transition:transform .2s;
    }
    .modal-overlay.show .modal { transform:translateY(0); }
    .modal-title { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:3px; color:var(--text); margin-bottom:24px; }
    .modal-close { position:absolute; top:16px; right:16px; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px; }
    .modal-close:hover { color:var(--text); }

    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .form-grid.full { grid-template-columns:1fr; }
    .field label { display:block; font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .field input, .field select {
      width:100%; background:var(--dark); border:1px solid var(--border);
      border-radius:2px; padding:9px 12px; color:var(--text);
      font-family:'IBM Plex Mono',monospace; font-size:13px; outline:none; transition:border-color .2s;
    }
    .field input:focus, .field select:focus { border-color:var(--brand); }
    .field { margin-bottom:0; }

    .modal-actions { display:flex; gap:10px; margin-top:24px; justify-content:flex-end; }

    .alert { padding:10px 14px; border-radius:2px; font-size:13px; margin-bottom:20px; display:none; }
    .alert-error   { background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.4);   color:#fca5a5; }
    .alert-success { background:rgba(34,197,94,.15);  border:1px solid rgba(34,197,94,.4);   color:#86efac; }

    /* empty state */
    .empty { text-align:center; padding:48px 32px; color:var(--muted); }
    .empty .icon { font-size:48px; margin-bottom:12px; opacity:.3; }
    .empty p { font-size:14px; }

    /* pagination */
    .pagination { display:flex; align-items:center; gap:6px; margin-top:16px; justify-content:flex-end; }
    .page-btn { padding:5px 12px; background:var(--card); border:1px solid var(--border); border-radius:2px; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:11px; cursor:pointer; transition:all .15s; }
    .page-btn:hover { border-color:var(--brand); color:var(--text); }
    .page-btn.active { background:var(--brand); border-color:var(--brand); color:#fff; }

    .count-label { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin-right:auto; }
  </style>
</head>
<body>

<!-- ── Sidebar ── -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="icon">FR</div>
    <div>
      <div class="name">FIREARM REG.</div>
      <div class="ver">v1.0.4</div>
    </div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-user">
    <div class="user-avatar" id="sidebarAvatar">SA</div>
    <div class="user-info">
      <div class="user-name" id="sidebarName">Admin</div>
      <div class="user-role" id="sidebarRole">Admin</div>
    </div>
    <button class="logout-btn" onclick="logout()" title="Logout">⏏</button>
  </div>
</aside>

<!-- ── Main ── -->
<main class="main">
  <div class="topbar">
    <div>
      <div class="breadcrumb">FIREARM REGISTRY / USER MANAGEMENT</div>
      <h2>User Management</h2>
    </div>
  </div>

  <div class="content">

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="icon">⌕</span>
        <input type="text" id="searchInput" placeholder="Search by name, username, or email..." oninput="renderTable()"/>
      </div>
      <select class="filter-select" id="roleFilter" onchange="renderTable()">
        <option value="">All Roles</option>
        <option>Admin</option>
        <option>Officer</option>
        <option>Staff</option>
      </select>
      <select class="filter-select" id="statusFilter" onchange="renderTable()">
        <option value="">All Status</option>
        <option>Active</option>
        <option>Inactive</option>
      </select>
      <button class="btn btn-primary" onclick="openAddModal()">+ ADD USER</button>
    </div>

    <!-- Alert -->
    <div class="alert" id="mainAlert"></div>

    <!-- Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th onclick="sortBy('id')">#</th>
            <th onclick="sortBy('fullName')">Full Name</th>
            <th onclick="sortBy('username')">Username</th>
            <th onclick="sortBy('email')">Email</th>
            <th onclick="sortBy('role')">Role</th>
            <th onclick="sortBy('status')">Status</th>
            <th onclick="sortBy('createdAt')">Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody"></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination">
      <span class="count-label" id="countLabel"></span>
      <button class="page-btn" id="prevBtn" onclick="prevPage()">← Prev</button>
      <span id="pageNumbers"></span>
      <button class="page-btn" id="nextBtn" onclick="nextPage()">Next →</button>
    </div>

  </div>
</main>

<!-- ── Add / Edit Modal ── -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalTitle">ADD USER</div>
    <div class="alert" id="modalAlert"></div>
    <div class="form-grid">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="f_fullName" placeholder="Juan dela Cruz"/>
      </div>
      <div class="field">
        <label>Username</label>
        <input type="text" id="f_username" placeholder="jdelacruz"/>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="f_email" placeholder="jdelacruz@example.com"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="f_password" placeholder="••••••••"/>
      </div>
      <div class="field">
        <label>Role</label>
        <select id="f_role">
          <option>Admin</option>
          <option>Officer</option>
          <option selected>Staff</option>
        </select>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="f_status">
          <option selected>Active</option>
          <option>Inactive</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">CANCEL</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveUser()">SAVE USER</button>
    </div>
  </div>
</div>

<!-- ── Profile View Modal ── -->
<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <button class="modal-close" onclick="closeProfileModal()">✕</button>
    <div class="modal-title">USER PROFILE</div>
    <div style="text-align:center; margin-bottom:24px;">
      <div id="profileAvatar" style="width:64px;height:64px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:#fff;margin:0 auto 12px;"></div>
      <div id="profileName" style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;"></div>
      <div id="profileRole" style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:4px;"></div>
    </div>
    <div id="profileDetails" style="background:var(--dark);border:1px solid var(--border);border-radius:2px;padding:16px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:2;color:var(--muted);"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeProfileModal()">CLOSE</button>
    </div>
  </div>
</div>

<script>
  const currentUser = initApp('users');

  // ── State ────────────────────────────────────────────────────
  let editingId   = null;
  let currentPage = 1;
  const PAGE_SIZE = 8;
  let sortKey     = 'id';
  let sortAsc     = true;

  // ── Table Render ──────────────────────────────────────────────
  function getFiltered() {
    const q      = document.getElementById('searchInput').value.trim().toLowerCase();
    const role   = document.getElementById('roleFilter').value;
    const status = document.getElementById('statusFilter').value;

    return DB.select(MySQLConnection.TABLES.USERS).filter(u => {
      const matchQ = !q || u.fullName.toLowerCase().includes(q) || u.username.toLowerCase().includes(q) || u.email.toLowerCase().includes(q);
      const matchR = !role   || u.role   === role;
      const matchS = !status || u.status === status;
      return matchQ && matchR && matchS;
    }).sort((a, b) => {
      const va = (a[sortKey] || '').toString().toLowerCase();
      const vb = (b[sortKey] || '').toString().toLowerCase();
      return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
  }

  function renderTable() {
    const filtered = getFiltered();
    const total    = filtered.length;
    const pages    = Math.ceil(total / PAGE_SIZE) || 1;
    if (currentPage > pages) currentPage = pages;

    const slice = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
    const tbody = document.getElementById('usersTableBody');

    if (slice.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty"><div class="icon">◎</div><p>No users found.</p></div></td></tr>`;
    } else {
      tbody.innerHTML = slice.map(u => `
        <tr>
          <td style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)">#${u.id}</td>
          <td>
            <span style="font-weight:600;cursor:pointer;" onclick="viewProfile(${u.id})">${u.fullName}</span>
          </td>
          <td style="font-family:'IBM Plex Mono',monospace;font-size:12px;">${u.username}</td>
          <td style="font-size:12px;color:var(--muted);">${u.email}</td>
          <td><span class="badge badge-${u.role.toLowerCase()}">${u.role}</span></td>
          <td><span class="badge badge-${u.status.toLowerCase()}">${u.status}</span></td>
          <td style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)">${u.createdAt}</td>
          <td>
            <div class="action-btns">
              <button class="icon-btn edit"   title="Edit"   onclick="openEditModal(${u.id})">✎</button>
              ${u.status === 'Active'
                ? `<button class="icon-btn toggleOff" title="Deactivate" onclick="toggleStatus(${u.id}, 'Inactive')">⊘</button>`
                : `<button class="icon-btn toggle"    title="Activate"   onclick="toggleStatus(${u.id}, 'Active')">✓</button>`
              }
              <button class="icon-btn del" title="Delete" onclick="deleteUser(${u.id})">✕</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // Pagination
    document.getElementById('countLabel').textContent = `${total} user${total !== 1 ? 's' : ''} found`;
    const nums = document.getElementById('pageNumbers');
    nums.innerHTML = '';
    for (let i = 1; i <= pages; i++) {
      const b = document.createElement('button');
      b.className = 'page-btn' + (i === currentPage ? ' active' : '');
      b.textContent = i;
      b.onclick = () => { currentPage = i; renderTable(); };
      nums.appendChild(b);
    }
    document.getElementById('prevBtn').disabled = currentPage === 1;
    document.getElementById('nextBtn').disabled = currentPage === pages;
  }

  function sortBy(key) {
    if (sortKey === key) sortAsc = !sortAsc;
    else { sortKey = key; sortAsc = true; }
    renderTable();
  }

  function prevPage() { if (currentPage > 1) { currentPage--; renderTable(); } }
  function nextPage() {
    const pages = Math.ceil(getFiltered().length / PAGE_SIZE) || 1;
    if (currentPage < pages) { currentPage++; renderTable(); }
  }

  // ── Add Modal ─────────────────────────────────────────────────
  function openAddModal() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'ADD USER';
    document.getElementById('saveBtn').textContent    = 'SAVE USER';
    clearFields();
    document.getElementById('f_password').placeholder = '••••••••';
    document.getElementById('f_password').required    = true;
    showModal('userModal');
  }

  // ── Edit Modal ────────────────────────────────────────────────
  function openEditModal(id) {
    const users = DB.select(MySQLConnection.TABLES.USERS, { id });
    if (!users.length) return;
    const u = users[0];

    editingId = id;
    document.getElementById('modalTitle').textContent = 'EDIT USER';
    document.getElementById('saveBtn').textContent    = 'UPDATE USER';

    document.getElementById('f_fullName').value = u.fullName;
    document.getElementById('f_username').value = u.username;
    document.getElementById('f_email').value    = u.email;
    document.getElementById('f_password').value = '';
    document.getElementById('f_password').placeholder = 'Leave blank to keep current';
    document.getElementById('f_role').value    = u.role;
    document.getElementById('f_status').value  = u.status;

    clearModalAlert();
    showModal('userModal');
  }

  // ── Save (Add / Update) ───────────────────────────────────────
  function saveUser() {
    const fullName = document.getElementById('f_fullName').value.trim();
    const username = document.getElementById('f_username').value.trim();
    const email    = document.getElementById('f_email').value.trim();
    const password = document.getElementById('f_password').value.trim();
    const role     = document.getElementById('f_role').value;
    const status   = document.getElementById('f_status').value;

    clearModalAlert();

    if (!fullName || !username || !email) {
      showModalAlert('Full name, username, and email are required.', 'error'); return;
    }
    if (!editingId && !password) {
      showModalAlert('Password is required for new users.', 'error'); return;
    }
    if (password && password.length < 6) {
      showModalAlert('Password must be at least 6 characters.', 'error'); return;
    }

    // Check duplicate username
    const all = DB.select(MySQLConnection.TABLES.USERS);
    const dupUser = all.find(u => u.username === username && u.id !== editingId);
    const dupEmail = all.find(u => u.email === email && u.id !== editingId);
    if (dupUser)  { showModalAlert('Username already taken.', 'error'); return; }
    if (dupEmail) { showModalAlert('Email already in use.', 'error'); return; }

    const avatar = fullName.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

    if (editingId) {
      // UPDATE
      const updateData = { fullName, username, email, role, status, avatar };
      if (password) updateData.password = password;
      DB.update(MySQLConnection.TABLES.USERS, updateData, { id: editingId });

      // Refresh session if editing self
      if (currentUser.id === editingId) {
        const updated = DB.select(MySQLConnection.TABLES.USERS, { id: editingId })[0];
        sessionStorage.setItem('currentUser', JSON.stringify(updated));
        document.getElementById('sidebarAvatar').textContent = updated.avatar;
        document.getElementById('sidebarName').textContent   = updated.fullName;
        document.getElementById('sidebarRole').textContent   = updated.role;
      }

      showMainAlert('User updated successfully.', 'success');
    } else {
      // INSERT
      DB.insert(MySQLConnection.TABLES.USERS, {
        fullName, username, email, password, role, status, avatar,
        createdAt: new Date().toISOString().split('T')[0],
      });
      showMainAlert('User added successfully.', 'success');
    }

    closeModal();
    renderTable();
  }

  // ── Toggle Status ─────────────────────────────────────────────
  function toggleStatus(id, newStatus) {
    // Prevent deactivating self
    if (id === currentUser.id && newStatus === 'Inactive') {
      showMainAlert('You cannot deactivate your own account.', 'error'); return;
    }
    DB.update(MySQLConnection.TABLES.USERS, { status: newStatus }, { id });
    showMainAlert(`Account ${newStatus === 'Active' ? 'activated' : 'deactivated'} successfully.`, 'success');
    renderTable();
  }

  // ── Delete ────────────────────────────────────────────────────
  function deleteUser(id) {
    if (id === currentUser.id) { showMainAlert('You cannot delete your own account.', 'error'); return; }
    if (!confirm('Are you sure you want to delete this user? This cannot be undone.')) return;
    DB.delete(MySQLConnection.TABLES.USERS, { id });
    showMainAlert('User deleted.', 'success');
    renderTable();
  }

  // ── View Profile ──────────────────────────────────────────────
  function viewProfile(id) {
    const users = DB.select(MySQLConnection.TABLES.USERS, { id });
    if (!users.length) return;
    const u = users[0];

    document.getElementById('profileAvatar').textContent = u.avatar || u.fullName.slice(0,2).toUpperCase();
    document.getElementById('profileName').textContent   = u.fullName;
    document.getElementById('profileRole').textContent   = `${u.role} · ${u.status}`;
    document.getElementById('profileDetails').innerHTML  = `
      <div><span style="color:var(--accent)">USERNAME</span>  &nbsp;${u.username}</div>
      <div><span style="color:var(--accent)">EMAIL</span>     &nbsp;${u.email}</div>
      <div><span style="color:var(--accent)">ROLE</span>      &nbsp;${u.role}</div>
      <div><span style="color:var(--accent)">STATUS</span>    &nbsp;${u.status}</div>
      <div><span style="color:var(--accent)">CREATED</span>   &nbsp;${u.createdAt}</div>
      <div><span style="color:var(--accent)">USER ID</span>   &nbsp;#${u.id}</div>
    `;
    showModal('profileModal');
  }

  // ── Helpers ───────────────────────────────────────────────────
  function showModal(id)  { document.getElementById(id).classList.add('show'); }
  function closeModal()   { document.getElementById('userModal').classList.remove('show'); clearFields(); }
  function closeProfileModal() { document.getElementById('profileModal').classList.remove('show'); }

  function clearFields() {
    ['f_fullName','f_username','f_email','f_password'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f_role').value   = 'Staff';
    document.getElementById('f_status').value = 'Active';
    clearModalAlert();
  }

  function showMainAlert(msg, type) {
    const b = document.getElementById('mainAlert');
    b.textContent = msg; b.className = `alert alert-${type}`; b.style.display = 'block';
    setTimeout(() => b.style.display = 'none', 4000);
  }
  function showModalAlert(msg, type) {
    const b = document.getElementById('modalAlert');
    b.textContent = msg; b.className = `alert alert-${type}`; b.style.display = 'block';
  }
  function clearModalAlert() { document.getElementById('modalAlert').style.display = 'none'; }


  // Close modal on overlay click
  document.getElementById('userModal').addEventListener('click', e => { if (e.target.id === 'userModal') closeModal(); });
  document.getElementById('profileModal').addEventListener('click', e => { if (e.target.id === 'profileModal') closeProfileModal(); });

  // ── Init ──────────────────────────────────────────────────────
  renderTable();
</script>

</body>
</html>
