<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory — Firearm Registry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <script src="db.js"></script>
  <script src="app-common.js"></script>
  <style>
    :root { --brand:#1d4ed8; --accent:#f59e0b; --dark:#0f172a; --surface:#1e293b; --card:#243044; --text:#e2e8f0; --muted:#64748b; --border:rgba(100,116,139,.2); --danger:#ef4444; --success:#22c55e; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'IBM Plex Sans',sans-serif; background:var(--dark); color:var(--text); display:flex; min-height:100vh; }

    .sidebar { width:240px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; height:100vh; position:sticky; top:0; }
    .sidebar-brand { padding:24px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
    .sidebar-brand .icon { width:34px; height:34px; background:var(--brand); border-radius:2px; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:16px; color:#fff; }
    .sidebar-brand .name { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; color:var(--text); line-height:1; }
    .sidebar-brand .ver { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); letter-spacing:1px; }
    .sidebar-nav { flex:1; padding:16px 12px; }
    .nav-label { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted); padding:0 8px; margin:16px 0 6px; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:3px; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; transition:all .15s; text-decoration:none; margin-bottom:2px; }
    .nav-item:hover { background:rgba(29,78,216,.15); color:var(--text); }
    .nav-item.active { background:var(--brand); color:#fff; }
    .nav-item .icon { font-size:15px; width:18px; text-align:center; }
    .sidebar-user { padding:16px 20px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; }
    .user-avatar { width:34px; height:34px; border-radius:50%; background:var(--brand); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:#fff; }
    .user-info { flex:1; min-width:0; }
    .user-name { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .user-role { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); }
    .logout-btn { font-size:16px; cursor:pointer; color:var(--muted); transition:color .15s; background:none; border:none; padding:4px; }
    .logout-btn:hover { color:var(--danger); }

    .main { flex:1; overflow-y:auto; }
    .topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:16px 32px; display:flex; align-items:center; justify-content:space-between; }
    .topbar h2 { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:3px; color:var(--text); }
    .topbar .breadcrumb { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:1px; }
    .content { padding:32px; }

    .toolbar { display:flex; align-items:center; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
    .search-wrap { position:relative; flex:1; min-width:200px; }
    .search-wrap input { width:100%; background:var(--card); border:1px solid var(--border); border-radius:2px; padding:9px 14px 9px 36px; color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:13px; outline:none; transition:border-color .2s; }
    .search-wrap input:focus { border-color:var(--brand); }
    .search-wrap .icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; color:var(--muted); }
    .filter-select { background:var(--card); border:1px solid var(--border); border-radius:2px; padding:9px 14px; color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:12px; outline:none; }
    .btn { padding:9px 18px; border:none; border-radius:2px; cursor:pointer; transition:all .15s; font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:2px; }
    .btn-primary { background:var(--brand); color:#fff; }
    .btn-primary:hover { background:#1e40af; }
    .btn-success { background:var(--success); color:#fff; }
    .btn-success:hover { background:#16a34a; }
    .btn-outline { background:transparent; color:var(--muted); border:1px solid var(--border); font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1px; padding:6px 12px; }
    .btn-outline:hover { border-color:var(--brand); color:var(--text); }

    .table-wrap { background:var(--card); border:1px solid var(--border); border-radius:3px; overflow:hidden; }
    table { width:100%; border-collapse:collapse; }
    thead tr { background:rgba(29,78,216,.12); }
    th { padding:10px 16px; font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted); text-align:left; }
    td { padding:12px 16px; font-size:13px; color:var(--text); border-top:1px solid var(--border); }
    tbody tr:hover { background:rgba(255,255,255,.02); }

    .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:1px; }
    .badge-available { background:rgba(34,197,94,.15); color:#4ade80; }
    .badge-sold      { background:rgba(239,68,68,.15);  color:#f87171; }
    .badge-reserved  { background:rgba(245,158,11,.15); color:#fbbf24; }

    .action-btns { display:flex; gap:6px; }
    .icon-btn { padding:5px 8px; border-radius:2px; border:none; cursor:pointer; font-size:13px; transition:all .15s; }
    .icon-btn.edit { background:rgba(29,78,216,.2); color:#60a5fa; }
    .icon-btn.edit:hover { background:rgba(29,78,216,.4); }
    .icon-btn.del { background:rgba(239,68,68,.15); color:#f87171; }
    .icon-btn.del:hover { background:rgba(239,68,68,.35); }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:1000; backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity .2s; }
    .modal-overlay.show { opacity:1; pointer-events:all; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:4px; width:480px; padding:40px; position:relative; transform:translateY(20px); transition:transform .2s; }
    .modal-overlay.show .modal { transform:translateY(0); }
    .modal-title { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:3px; color:var(--text); margin-bottom:24px; }
    .modal-close { position:absolute; top:16px; right:16px; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px; }
    .modal-close:hover { color:var(--text); }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .field label { display:block; font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .field input, .field select { width:100%; background:var(--dark); border:1px solid var(--border); border-radius:2px; padding:9px 12px; color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:13px; outline:none; transition:border-color .2s; }
    .field input:focus, .field select:focus { border-color:var(--brand); }
    .modal-actions { display:flex; gap:10px; margin-top:24px; justify-content:flex-end; }
    .alert { padding:10px 14px; border-radius:2px; font-size:13px; margin-bottom:20px; display:none; }
    .alert-error   { background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.4); color:#fca5a5; }
    .alert-success { background:rgba(34,197,94,.15); border:1px solid rgba(34,197,94,.4); color:#86efac; }
    .empty { text-align:center; padding:48px 32px; color:var(--muted); }
    .empty .icon { font-size:48px; margin-bottom:12px; opacity:.3; }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="icon">FR</div>
    <div>
      <div class="name">FIREARM REG.</div>
      <div class="ver">v1.0.4</div>
    </div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-user">
    <div class="user-avatar" id="sidebarAvatar">SA</div>
    <div class="user-info">
      <div class="user-name" id="sidebarName">Admin</div>
      <div class="user-role" id="sidebarRole">Admin</div>
    </div>
    <button class="logout-btn" onclick="logout()">⏏</button>
  </div>
</aside>

<!-- Main -->
<main class="main">
  <div class="topbar">
    <div>
      <div class="breadcrumb">FIREARM REGISTRY / INVENTORY</div>
      <h2>Inventory Records</h2>
    </div>
  </div>

  <div class="content">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="icon">⌕</span>
        <input type="text" id="searchInput" placeholder="Search by serial, model..." oninput="renderTable()"/>
      </div>
      <select class="filter-select" id="statusFilter" onchange="renderTable()">
        <option value="">All Status</option>
        <option>Available</option>
        <option>Sold</option>
        <option>Reserved</option>
      </select>
      <button class="btn btn-success" onclick="exportCSV()">↓ EXPORT CSV</button>
      <button class="btn btn-primary" onclick="openAddModal()">+ ADD ITEM</button>
    </div>

    <div class="alert" id="mainAlert"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Serial Number</th>
            <th>Model</th>
            <th>Caliber</th>
            <th>Status</th>
            <th>Price</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inventoryBody"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalTitle">ADD ITEM</div>
    <div class="alert" id="modalAlert"></div>
    <div class="form-grid">
      <div class="field">
        <label>Serial Number</label>
        <input type="text" id="f_serial" placeholder="GLK-1001"/>
      </div>
      <div class="field">
        <label>Model</label>
        <input type="text" id="f_model" placeholder="G17 Gen5"/>
      </div>
      <div class="field">
        <label>Caliber</label>
        <input type="text" id="f_caliber" placeholder="9mm"/>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="f_status">
          <option>Available</option>
          <option>Sold</option>
          <option>Reserved</option>
        </select>
      </div>
      <div class="field">
        <label>Price (USD)</label>
        <input type="number" id="f_price" placeholder="450.00" step="0.01"/>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">CANCEL</button>
      <button class="btn btn-primary" onclick="saveItem()">SAVE</button>
    </div>
  </div>
</div>

<script>
  const currentUser = initApp('inventory');

  const INV = MySQLConnection.TABLES.INVENTORY;
  let editingSerial = null;

  function getFiltered() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const s = document.getElementById('statusFilter').value;
    return DB.select(INV).filter(i => {
      const mq = !q || i.serial.toLowerCase().includes(q) || i.model.toLowerCase().includes(q);
      const ms = !s || i.status === s;
      return mq && ms;
    });
  }

  function renderTable() {
    const items = getFiltered();
    const tbody = document.getElementById('inventoryBody');
    if (!items.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><div class="icon">⊟</div><p>No inventory items found.</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = items.map(i => `
      <tr>
        <td style="font-family:'IBM Plex Mono',monospace;font-weight:600;">${i.serial}</td>
        <td>${i.model}</td>
        <td style="font-family:'IBM Plex Mono',monospace;font-size:12px;">${i.caliber || '—'}</td>
        <td><span class="badge badge-${i.status.toLowerCase()}">${i.status}</span></td>
        <td style="font-family:'IBM Plex Mono',monospace;">$${parseFloat(i.price).toFixed(2)}</td>
        <td>
          <div class="action-btns">
            <button class="icon-btn edit" onclick="openEditModal('${i.serial}')">✎</button>
            <button class="icon-btn del"  onclick="deleteItem('${i.serial}')">✕</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function openAddModal() {
    editingSerial = null;
    document.getElementById('modalTitle').textContent = 'ADD ITEM';
    clearFields();
    showModal();
  }

  function openEditModal(serial) {
    const items = DB.select(INV).filter(i => i.serial === serial);
    if (!items.length) return;
    const item = items[0];
    editingSerial = serial;
    document.getElementById('modalTitle').textContent = 'EDIT ITEM';
    document.getElementById('f_serial').value  = item.serial;
    document.getElementById('f_model').value   = item.model;
    document.getElementById('f_caliber').value = item.caliber || '';
    document.getElementById('f_status').value  = item.status;
    document.getElementById('f_price').value   = item.price;
    clearModalAlert();
    showModal();
  }

  function saveItem() {
    const serial  = document.getElementById('f_serial').value.trim().toUpperCase();
    const model   = document.getElementById('f_model').value.trim();
    const caliber = document.getElementById('f_caliber').value.trim();
    const status  = document.getElementById('f_status').value;
    const price   = parseFloat(document.getElementById('f_price').value);
    clearModalAlert();

    if (!serial || !model || isNaN(price)) {
      showModalAlert('Serial number, model, and price are required.', 'error'); return;
    }

    if (editingSerial) {
      DB.update(INV, { serial, model, caliber, status, price }, { serial: editingSerial });
      showMainAlert('Item updated.', 'success');
    } else {
      const dup = DB.select(INV).find(i => i.serial === serial);
      if (dup) { showModalAlert('Serial number already exists.', 'error'); return; }
      DB.insert(INV, { serial, model, caliber, status, price });
      showMainAlert('Item added.', 'success');
    }
    closeModal(); renderTable();
  }

  function deleteItem(serial) {
    if (!confirm(`Delete item ${serial}? This cannot be undone.`)) return;
    DB.delete(INV, { serial });
    showMainAlert('Item deleted.', 'success');
    renderTable();
  }

  function exportCSV() {
    const items = DB.select(INV);
    const header = ['Serial Number', 'Model', 'Caliber', 'Status', 'Price'];
    const rows   = items.map(i => [i.serial, i.model, i.caliber||'', i.status, i.price]);
    const csv    = [header, ...rows].map(r => r.join(',')).join('\n');
    const blob   = new Blob([csv], { type:'text/csv' });
    const url    = URL.createObjectURL(blob);
    const a      = document.createElement('a');
    a.href = url; a.download = 'inventory.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  function showModal()  { document.getElementById('itemModal').classList.add('show'); }
  function closeModal() { document.getElementById('itemModal').classList.remove('show'); clearFields(); }
  function clearFields() {
    ['f_serial','f_model','f_caliber','f_price'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f_status').value = 'Available';
    clearModalAlert();
  }
  function showMainAlert(msg, type) {
    const b = document.getElementById('mainAlert');
    b.textContent = msg; b.className = `alert alert-${type}`; b.style.display = 'block';
    setTimeout(() => b.style.display = 'none', 4000);
  }
  function showModalAlert(msg, type) {
    const b = document.getElementById('modalAlert');
    b.textContent = msg; b.className = `alert alert-${type}`; b.style.display = 'block';
  }
  function clearModalAlert() { document.getElementById('modalAlert').style.display = 'none'; }

  document.getElementById('itemModal').addEventListener('click', e => { if (e.target.id === 'itemModal') closeModal(); });

  renderTable();
</script>

</body>
</html>
